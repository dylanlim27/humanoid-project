[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoscene-3d"
version = "0.1.0"
description = "Embodied 3D Scene Differencing & Spatial Change Grounding from Monocular Phone Video"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dylan", email = "dylan@example.com"}
]
keywords = [
    "robotics",
    "embodied-ai",
    "3d-computer-vision",
    "change-detection",
    "scene-understanding",
    "spatial-reasoning"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "streamlit>=1.30.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chronoscene*"]
